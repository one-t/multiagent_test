<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Astralis Tarot — The Candlelit Altar</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <canvas id="candleCanvas"></canvas>
    <div class="vignette-overlay" aria-hidden="true"></div>

    <div class="app-container">
      <header class="altar-header">
        <div class="header-top">
          <div class="brand-section">
            <div class="altar-sigil" aria-hidden="true">✻</div>
            <div class="brand-titles">
              <h1>ASTRALIS</h1>
              <p class="subtitle">The candlelit altar</p>
            </div>
          </div>
          <div class="header-actions">
            <div class="deck-selector-wrap">
              <label for="deckThemeSelect" class="deck-select-label">Deck</label>
              <select id="deckThemeSelect" class="deck-theme-select" title="Choose Deck Theme">
                <option value="household" selected>Household Arcana</option>
                <option value="surrealist">🏛️ Surrealist Altar</option>
                <option value="feline">🐱 Feline Familiars</option>
                <option value="feline_mystica">✨ Feline Mystica</option>
              </select>
            </div>
            <button type="button" id="ambianceToggleBtn" class="icon-btn" title="Candlelight">☀</button>
            <button type="button" id="muteToggleBtn" class="icon-btn" title="Sound">♫</button>
            <button type="button" id="compendiumBtn" class="btn btn-ghost">Compendium</button>
            <button type="button" id="readersPanelBtn" class="btn btn-gold">Readers</button>
            <div class="reader-badge-header" id="activeReaderChip">
              <div class="reader-avatar-circle" id="activeReaderAvatar">✦</div>
              <span id="activeReaderName">Reader</span>
            </div>
          </div>
        </div>

        <div class="control-strip">
          <div class="spread-selector-group">
            <button type="button" class="spread-tab-btn active" data-spread="single">1 Card</button>
            <button type="button" class="spread-tab-btn" data-spread="three_card">3 Cards</button>
            <button type="button" class="spread-tab-btn" data-spread="celtic_cross">Celtic Cross</button>
            <div class="subtheme-container" id="threeCardThemeBox" style="display: none">
              <label for="threeCardThemeSelect">Frame</label>
              <select id="threeCardThemeSelect" class="subtheme-select">
                <option value="past_present_future">Past / Present / Future</option>
                <option value="situation_obstacle_advice">Situation / Obstacle / Advice</option>
                <option value="mind_body_spirit">Mind / Body / Spirit</option>
              </select>
            </div>
          </div>
          <div class="query-row">
            <div class="query-input-wrap">
              <span class="input-icon" aria-hidden="true">✻</span>
              <input id="queryInput" class="query-input" type="text" maxlength="280" placeholder="Ask plainly. The clerk can tell when you decorate it." />
            </div>
            <label class="toggle-label">
              <input id="reversalsToggle" class="toggle-checkbox" type="checkbox" checked />
              Allow reversals
            </label>
          </div>
        </div>
      </header>

      <main class="altar-stage">
        <div class="stage-status">
          <h2 class="stage-title" id="stageSpreadTitle">Single Card</h2>
          <p class="stage-desc" id="stageSpreadDesc"></p>
          <div class="stage-actions">
            <button type="button" id="shuffleDealBtn" class="btn btn-gold">Shuffle &amp; deal</button>
            <button type="button" id="revealAllBtn" class="btn btn-ghost">Reveal &amp; read</button>
          </div>
        </div>
        <div id="cardsLayoutContainer" class="cards-layout-container"></div>
        <section id="readingSection" class="reading-section" style="display: none"></section>
      </main>
    </div>

    <div id="readersDrawerBackdrop" class="drawer-backdrop">
      <aside class="drawer-panel" aria-label="Readers">
        <div class="drawer-header">
          <h3>Readers</h3>
          <button type="button" id="closeReadersDrawer" class="modal-close-btn" aria-label="Close readers">×</button>
        </div>
        <div class="drawer-tabs">
          <button type="button" class="drawer-tab active" data-tab="active-readers">On duty</button>
          <button type="button" class="drawer-tab" data-tab="plugin-dev">Plug-in</button>
        </div>
        <div class="drawer-body">
          <div id="tabActiveReaders">
            <div id="readersList"></div>
          </div>
          <div id="tabPluginDev" style="display: none">
            <div class="plugin-dev-box">
              <textarea id="customPluginCode" class="code-editor-area" spellcheck="false"></textarea>
              <button type="button" id="resetPluginTemplateBtn" class="btn btn-ghost">Reset template</button>
              <button type="button" id="registerCustomReaderBtn" class="btn btn-gold">Register reader</button>
              <p id="pluginStatusMsg"></p>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <div id="cardModalBackdrop" class="modal-backdrop">
      <div class="modal-content">
        <button type="button" id="closeCardModal" class="modal-close-btn" aria-label="Close card">×</button>
        <div class="modal-card-display">
          <div id="modalCardStage" class="modal-card-stage"></div>
          <button type="button" id="modalToggleOrientationBtn" class="btn btn-ghost">Turn the plate</button>
        </div>
        <div class="modal-details">
          <div class="modal-header">
            <h2 id="modalCardName"></h2>
            <p id="modalEsotericTitle" class="modal-esoteric-title"></p>
          </div>
          <div class="modal-badges">
            <span id="modalArcanaBadge"></span>
            <span id="modalElementBadge"></span>
            <span id="modalOrientationBadge"></span>
          </div>
          <div class="modal-body-section">
            <h4>Keywords</h4>
            <p id="modalKeywords"></p>
          </div>
          <div class="modal-body-section">
            <h4>Upright</h4>
            <p id="modalMeaningUpright"></p>
          </div>
          <div class="modal-body-section">
            <h4>Reversed</h4>
            <p id="modalMeaningReversed"></p>
          </div>
          <div class="modal-body-section">
            <h4>Symbols</h4>
            <p id="modalSymbols"></p>
          </div>
        </div>
      </div>
    </div>

    <div id="compendiumModalBackdrop" class="modal-backdrop">
      <div class="modal-content compendium-modal">
        <button type="button" id="closeCompendiumModal" class="modal-close-btn" aria-label="Close compendium">×</button>
        <h2>The case</h2>
        <input id="compendiumSearchInput" class="compendium-search" type="search" placeholder="Search the seventy-eight" />
        <div class="compendium-filters">
          <button type="button" class="active" data-filter="all">All</button>
          <button type="button" data-filter="major">Major</button>
          <button type="button" data-filter="wands">Wands</button>
          <button type="button" data-filter="cups">Cups</button>
          <button type="button" data-filter="swords">Swords</button>
          <button type="button" data-filter="pentacles">Pentacles</button>
        </div>
        <div id="compendiumGrid" class="compendium-grid"></div>
      </div>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
